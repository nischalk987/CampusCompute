name: CampusCompute Linux build and tests

on:
  pull_request:
    paths:
      - "engine/**"
      - "backend/**"
      - "frontend/**"
      - "Makefile"
      - "README.md"
      - "ARCHITECTURE.md"
      - ".github/workflows/c-build.yml"
  push:
    branches: [main]

jobs:
  linux-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential coreutils
      - name: Clean build all C modules and integrated CLI
        run: make clean build
      - name: Run all C module and integrated CLI tests
        run: make test-engine

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Test local API adapter
        run: make test-backend

  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dashboard dependencies
        run: npm install
      - name: Build dashboard
        run: npm run build
