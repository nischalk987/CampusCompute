name: C module build and tests

on:
  pull_request:
    paths:
      - "engine/src/job_manager/**"
      - "engine/src/scheduler/**"
      - "engine/src/producer_consumer/**"
      - "engine/src/shared_memory/**"
      - "engine/src/process_manager/**"
      - "engine/src/resource_limits/**"
      - "engine/src/main.c"
      - "engine/Makefile"
      - "engine/tests/**"
      - "backend/**"
      - "frontend/**"
      - "README.md"
      - "ARCHITECTURE.md"
      - ".github/workflows/c-build.yml"
  push:
    branches: [main]

jobs:
  c-modules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install compiler and make
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Test FR1 job manager
        run: make -C engine/src/job_manager clean test
      - name: Test FR2 scheduler
        run: make -C engine/src/scheduler clean test
      - name: Test FR3 producer-consumer
        run: make -C engine/src/producer_consumer clean test
      - name: Test FR5 Banker's Algorithm
        run: make -C engine/src/banker clean test
      - name: Test FR4 shared-memory IPC
        run: make -C engine/src/shared_memory clean test
      - name: Test integrated engine and FR4 menu flow
        run: make -C engine clean test


  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dashboard dependencies
        run: npm install
      - name: Build dashboard
        run: npm run build

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Test local API adapter
        run: PYTHONPATH=backend python -m pytest -q backend/tests
